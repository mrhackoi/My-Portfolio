[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Resume PDF.pdf"
  [headers.values]
    Content-Disposition = 'attachment; filename="Dhoni_Kumar_Shah_Resume.pdf"'

[[headers]]
  for = "/Resume%20PDF.pdf"
  [headers.values]
    Content-Disposition = 'attachment; filename="Dhoni_Kumar_Shah_Resume.pdf"'
